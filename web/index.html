<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0f0f0f" />
    <title>FC2-PPV — ホーム</title>
    <link rel="stylesheet" href="site.css?v=__ASSET_VERSION__" />
    <link
      rel="preload"
      href="catalog.json?v=__DATA_VERSION__"
      as="fetch"
      crossorigin
    />
    <script src="site.js?v=__ASSET_VERSION__" defer></script>
  </head>
  <body data-catalog="catalog.json?v=__DATA_VERSION__">
    <svg class="svg-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="i-menu" viewBox="0 0 24 24">
          <path d="M3 6h18M3 12h18M3 18h18" />
        </symbol>
        <symbol id="i-home" viewBox="0 0 24 24">
          <path d="m3 10 9-7 9 7v11h-6v-7H9v7H3Z" />
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="m16 16 5 5" />
        </symbol>
        <symbol id="i-trend" viewBox="0 0 24 24">
          <path
            d="M13 3c1 5 6 6 6 12a7 7 0 0 1-14 0c0-3 2-6 4-7-1 4 2 4 2 1 0-2 1-4 2-6Z"
          />
        </symbol>
        <symbol id="i-new" viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="15" rx="2" />
          <path d="M7 2v6M17 2v6M3 11h18m-11 4 2 2 4-4" />
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v6l4 2" />
        </symbol>
        <symbol id="i-history" viewBox="0 0 24 24">
          <path d="M3 5v5h5M3 10a9 9 0 1 1 1 8M12 7v6l4 2" />
        </symbol>
        <symbol id="i-save" viewBox="0 0 24 24">
          <path d="M6 3h12v18l-6-4-6 4Z" />
        </symbol>
        <symbol id="i-library" viewBox="0 0 24 24">
          <path d="M4 4v15a2 2 0 0 0 2 2h14" />
          <rect x="8" y="3" width="13" height="14" rx="2" />
          <path d="m13 7 4 3-4 3Z" />
        </symbol>
        <symbol id="i-star" viewBox="0 0 24 24">
          <path
            d="m12 3 2.8 5.8 6.4.9-4.6 4.5 1.1 6.4L12 17.5l-5.7 3.1 1.1-6.4-4.6-4.5 6.4-.9Z"
          />
        </symbol>
        <symbol id="i-filter" viewBox="0 0 24 24">
          <path
            d="M3 6h7m4 0h7M3 12h12m4 0h2M3 18h3m4 0h11M10 3v6M15 9v6M6 15v6"
          />
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24">
          <path d="m6 6 12 12M6 18 18 6" />
        </symbol>
        <symbol id="i-more" viewBox="0 0 24 24">
          <circle cx="12" cy="5" r="1" />
          <circle cx="12" cy="12" r="1" />
          <circle cx="12" cy="19" r="1" />
        </symbol>
        <symbol id="i-play" viewBox="0 0 24 24">
          <path d="m8 4 12 8-12 8Z" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24">
          <path d="m4 12 5 5L20 6" />
        </symbol>
        <symbol id="i-link" viewBox="0 0 24 24">
          <path d="M14 3h7v7m0-7L10 14M10 3H4v17h17v-6" />
        </symbol>
        <symbol id="i-copy" viewBox="0 0 24 24">
          <rect x="8" y="8" width="13" height="13" rx="2" />
          <path d="M16 8V3H3v13h5" />
        </symbol>
        <symbol id="i-info" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 11v6m0-10v1" />
        </symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24">
          <path d="m12 5-7 7 7 7M5 12h15" />
        </symbol>
      </defs>
    </svg>
    <a class="skip-link" href="#main">作品一覧へ</a>
    <header class="topbar">
      <div class="brand-wrap">
        <button
          id="sidebarToggle"
          class="icon-button desktop-menu"
          aria-label="メニューを開閉"
          aria-expanded="true"
        >
          <svg><use href="#i-menu" /></svg>
        </button>
        <a
          class="brand"
          href="?page=home"
          data-page="home"
          aria-label="FC2-PPV ホーム"
          ><span>FC2-PPV</span><sup>JP</sup></a
        >
      </div>
      <form id="searchForm" class="search-form" role="search">
        <button
          type="button"
          id="searchBack"
          class="icon-button mobile-only"
          aria-label="検索を閉じる"
        >
          <svg><use href="#i-arrow" /></svg>
        </button>
        <div class="search-field">
          <input
            id="q"
            type="search"
            placeholder="番号・タイトルで検索"
            aria-label="番号・タイトルで検索"
            autocomplete="off"
            aria-controls="suggest"
            aria-expanded="false"
          /><button
            id="clearSearch"
            class="icon-button"
            type="button"
            aria-label="検索をクリア"
            hidden
          >
            <svg><use href="#i-close" /></svg>
          </button>
        </div>
        <button class="search-submit" type="submit" aria-label="検索">
          <svg><use href="#i-search" /></svg>
        </button>
        <div id="suggest" class="suggest" hidden></div>
      </form>
      <div class="header-actions">
        <button
          id="mobileSearch"
          class="icon-button mobile-only"
          aria-label="検索を開く"
        >
          <svg><use href="#i-search" /></svg></button
        ><button id="infoButton" class="icon-button" aria-label="更新情報">
          <svg><use href="#i-info" /></svg></button
        ><button
          class="profile"
          data-page="library"
          aria-label="マイライブラリ"
        >
          <svg><use href="#i-library" /></svg>
        </button>
      </div>
    </header>
    <div id="navBackdrop" hidden></div>
    <aside class="sidebar" aria-label="メインメニュー">
      <nav>
        <button data-page="home" class="nav-item active">
          <svg><use href="#i-home" /></svg><span>ホーム</span>
        </button>
        <button data-page="new" class="nav-item">
          <svg><use href="#i-new" /></svg><span>新着</span
          ><span class="nav-dot"></span>
        </button>
        <button data-page="popular" class="nav-item">
          <svg><use href="#i-star" /></svg><span>人気ランキング</span>
        </button>
        <button data-page="rising" class="nav-item">
          <svg><use href="#i-trend" /></svg><span>急上昇</span>
        </button>
        <hr />
        <button data-page="library" class="nav-item library-title">
          <span>マイライブラリ</span><span aria-hidden="true">›</span>
        </button>
        <button data-page="history" class="nav-item">
          <svg><use href="#i-history" /></svg><span>履歴</span>
        </button>
        <button data-page="later" class="nav-item">
          <svg><use href="#i-clock" /></svg><span>後で見る</span
          ><span class="nav-count" id="laterCount"></span>
        </button>
        <button data-page="saved" class="nav-item">
          <svg><use href="#i-save" /></svg><span>保存済み</span
          ><span class="nav-count" id="savedCount"></span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <span class="status-dot"></span> 2時間ごとに更新<br /><span
          class="updated-label"
          >最終更新 __UPDATED_AT__</span
        >
      </div>
    </aside>
    <main id="main" tabindex="-1">
      <div class="chipbar" id="chipbar" aria-label="作品カテゴリー">
        <button data-chip="all" class="chip active">すべて</button
        ><button data-chip="new" class="chip">新着</button
        ><button data-chip="today" class="chip">今日</button
        ><button data-chip="week" class="chip">1週間</button
        ><button data-chip="rated" class="chip">評価 4.0 以上</button
        ><button data-chip="ranked" class="chip">ランキング掲載</button
        ><button data-chip="dur60" class="chip">60分以上</button
        ><button data-chip="views10" class="chip">10万回以上</button
        ><button data-chip="saved" class="chip">保存済み</button>
      </div>
      <section class="feed" aria-label="作品一覧">
        <section
          id="homeRankings"
          class="ranking-section"
          aria-labelledby="rankingTitle"
          hidden
        >
          <div class="ranking-heading">
            <h2 id="rankingTitle">MissAVランキング</h2>
            <button id="rankingAll" class="text-button" type="button">
              すべて見る ›
            </button>
          </div>
          <div class="ranking-toolbar">
            <div class="ranking-periods" aria-label="MissAVランキングの期間">
              <button
                data-home-rank="day"
                class="chip active"
                aria-pressed="true"
              >
                今日
              </button>
              <button data-home-rank="week" class="chip" aria-pressed="false">
                週間
              </button>
              <button data-home-rank="month" class="chip" aria-pressed="false">
                月間
              </button>
              <button data-home-rank="total" class="chip" aria-pressed="false">
                全期間
              </button>
            </div>
            <div class="ranking-controls">
              <button
                id="rankingPrev"
                class="icon-button"
                type="button"
                aria-label="ランキングを左へ"
              >
                <svg><use href="#i-arrow" /></svg>
              </button>
              <button
                id="rankingNext"
                class="icon-button ranking-next"
                type="button"
                aria-label="ランキングを右へ"
              >
                <svg><use href="#i-arrow" /></svg>
              </button>
            </div>
          </div>
          <div
            id="rankingRail"
            class="ranking-rail"
            aria-label="MissAV 今日のランキング"
          ></div>
        </section>
        <div class="feed-heading">
          <div>
            <h1 id="listTitle">すべての作品</h1>
            <span id="resultCount" class="result-count" role="status"
              >読み込み中…</span
            >
          </div>
          <div class="feed-tools">
            <label class="sort-label"
              ><span class="sr-only">並べ替え</span
              ><select id="sortSelect">
                <option value="new">新しい順</option>
                <option value="old">古い順</option>
                <option value="rating">評価順</option>
                <option value="reviews">レビュー数順</option>
                <option value="views">再生数順</option>
                <option value="long">長い順</option>
                <option value="short">短い順</option>
              </select></label
            ><button id="filterButton" class="filter-button">
              <svg><use href="#i-filter" /></svg><span>フィルター</span
              ><b id="filterCount" hidden></b>
            </button>
          </div>
        </div>
        <div id="contextTabs" class="context-tabs" hidden></div>
        <p id="contextNote" class="context-note" hidden></p>
        <div id="activeFilters" class="active-filters" hidden></div>
        <div id="emptyState" class="empty-state" hidden></div>
        <div id="feedWindow">
          <div id="topSpacer" aria-hidden="true"></div>
          <div id="grid" class="video-grid" aria-busy="true">
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
          </div>
          <div id="bottomSpacer" aria-hidden="true"></div>
        </div>
        <div class="load-more-wrap" id="loadMoreWrap" hidden>
          <button id="loadMore" class="pill-button">さらに表示</button>
        </div>
        <p id="feedEnd" class="feed-end" hidden>すべて表示しました</p>
      </section>
    </main>
    <nav class="bottom-nav" aria-label="下部メニュー">
      <button data-page="home" class="active">
        <svg><use href="#i-home" /></svg><span>ホーム</span></button
      ><button data-page="new">
        <svg><use href="#i-new" /></svg><span>新着</span></button
      ><button data-page="popular">
        <svg><use href="#i-star" /></svg><span>人気</span></button
      ><button data-page="history">
        <svg><use href="#i-history" /></svg><span>履歴</span></button
      ><button data-page="library">
        <svg><use href="#i-library" /></svg><span>ライブラリ</span>
      </button>
    </nav>
    <dialog id="filterDialog" class="sheet">
      <div class="dialog-heading">
        <h2>フィルター</h2>
        <button class="icon-button" data-close aria-label="閉じる">
          <svg><use href="#i-close" /></svg>
        </button>
      </div>
      <div id="filterGroups"></div>
      <div class="dialog-footer">
        <button id="resetFilters" class="text-button">リセット</button
        ><button class="pill-button primary" data-close>結果を表示</button>
      </div>
    </dialog>
    <dialog
      id="menuDialog"
      class="sheet card-menu"
      aria-label="作品メニュー"
    ></dialog>
    <dialog
      id="previewDialog"
      class="sheet preview-dialog"
      aria-label="サンプルプレビュー"
    >
      <div class="dialog-heading">
        <h2 id="previewTitle">サンプルプレビュー</h2>
        <button class="icon-button" data-close aria-label="閉じる">
          <svg><use href="#i-close" /></svg>
        </button>
      </div>
      <video id="previewPlayer" controls playsinline preload="none"></video>
      <p id="previewError" hidden>
        プレビューを読み込めませんでした。作品ページから確認してください。
      </p>
      <a
        id="previewLink"
        class="pill-button primary"
        target="_blank"
        rel="noopener noreferrer"
        >作品ページを開く</a
      >
    </dialog>
    <dialog id="infoDialog" class="sheet info-dialog">
      <div class="dialog-heading">
        <h2>更新情報</h2>
        <button class="icon-button" data-close aria-label="閉じる">
          <svg><use href="#i-close" /></svg>
        </button>
      </div>
      <p>最終更新 <strong>__UPDATED_AT__</strong></p>
      <p>全 __ITEM_COUNT__ 作品・今回の新着 __NEW_COUNT__ 作品</p>
      <p class="context-note">
        保存・後で見る・履歴は、このブラウザに保存されます。
      </p>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <noscript
      ><p class="empty-state">
        作品一覧を表示するには JavaScript を有効にしてください。
      </p></noscript
    >
  </body>
</html>
