name: Regression tests
on:
  pull_request:
    paths: ["fc2_monitor.py", "web/**", "tests/**", ".github/workflows/**", "requirements.txt"]
  push:
    branches: [main]
    paths: ["fc2_monitor.py", "web/**", "tests/**", ".github/workflows/test.yml", "requirements.txt"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check web/site.js
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps chromium webkit
      - run: python tests/build_fixture.py test-results/fixture
      - run: node tests/browser.cjs
      - run: node tests/preview.cjs
      - run: PREVIEW_BROWSER=webkit node tests/preview.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-regression-results
          path: |
            test-results/*.png
            test-results/browser-results.json
          if-no-files-found: ignore
