name: Compact FC2 Monitor Pages

on:
  # Normal assets are published by monitor.yml. This is an offline recovery
  # build, not a second publisher racing each source or generated-data change.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/compact-pages.yml"
  workflow_dispatch:

concurrency:
  group: fc2ppv-monitor-main-v3
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r requirements.txt

      # Use the same renderer as monitor.yml. The retired compactor patches
      # obsolete JavaScript markers and fails against the progressive loader.
      - name: Rebuild public assets from saved data
        run: |
          python fc2_monitor.py --build-site
          python optimize_public_catalog.py
          python embed_catalog_bootstrap.py

      - name: Ensure MissAV-only navigation guard is deployed
        run: |
          cp web/missav-only.js docs/missav-only.js
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path("docs/index.html")
          html = path.read_text(encoding="utf-8")
          tag = f'    <script src="missav-only.js?v={os.environ.get("GITHUB_SHA", "")[:12]}" defer></script>\n'
          if "missav-only.js" not in html:
              html = html.replace("</body>", tag + "</body>")
          path.write_text(html, encoding="utf-8")
          PY

      - name: Verify generated public JavaScript
        run: |
          node --check docs/site.js
          node --check docs/missav-only.js
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('docs/catalog.json').read_text(encoding='utf-8'))
          html = Path('docs/index.html').read_text(encoding='utf-8')
          assert manifest.get('progressive') is True
          assert int(manifest.get('item_count') or 0) >= len(manifest.get('items') or [])
          assert 'id="catalogBootstrapData"' in html
          assert 'missav-only.js' in html
          PY

      - name: Commit compact public assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "更新なし"
          else
            git commit -m "Compact monitor public catalog"
            git pull --rebase origin main
            git push
          fi

      - id: artifact
        run: echo "name=github-pages-compact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Prepare lean Pages artifact
        run: |
          mkdir -p pages-public
          cp -a docs/. pages-public/
          rm -f pages-public/data.json pages-public/fetch_state.json pages-public/crawl_state.json \
                pages-public/views_history.json pages-public/notified_ids.json

      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: pages-public

  pages:
    needs: compact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.compact.outputs.artifact }}
