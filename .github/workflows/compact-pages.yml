name: Compact FC2 Monitor Pages

on:
  # Normal assets are published by monitor.yml. This is an offline recovery
  # build, not a second publisher racing each source or generated-data change.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/compact-pages.yml"
  workflow_dispatch:

concurrency:
  group: fc2ppv-monitor-main-v3
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compact:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r requirements.txt

      # Use the same renderer as monitor.yml. The retired compactor patches
      # obsolete JavaScript markers and fails against the progressive loader.
      - name: Rebuild public assets from saved data
        run: |
          python fc2_monitor.py --build-site
          python optimize_public_catalog.py
          python embed_catalog_bootstrap.py

      - name: Ensure MissAV-only navigation guard is deployed
        run: |
          cp web/missav-only.js docs/missav-only.js
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path("docs/index.html")
          html = path.read_text(encoding="utf-8")
          tag = f'    <script src="missav-only.js?v={os.environ.get("GITHUB_SHA", "")[:12]}" defer></script>\n'
          if "missav-only.js" not in html:
              html = html.replace("</body>", tag + "</body>")
          path.write_text(html, encoding="utf-8")
          PY

      - name: Verify generated public JavaScript
        run: |
          node --check docs/site.js
          node --check docs/missav-only.js
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('docs/catalog.json').read_text(encoding='utf-8'))
          html = Path('docs/index.html').read_text(encoding='utf-8')
          assert manifest.get('progressive') is True
          assert int(manifest.get('item_count') or 0) >= len(manifest.get('items') or [])
          assert 'id="catalogBootstrapData"' in html
          assert 'missav-only.js' in html
          PY

      - name: Commit compact public assets
        run: |
          # FC-18: non-fast-forward で push が弾かれたときだけ、fetch→rebase→push を計3回まで試す。
          # rebase の内容競合は abort して即停止する。強制 push はしない。失敗は非ゼロ終了。
          push_with_retry() {
            attempt=1
            while :; do
              if ! git fetch origin +refs/heads/main:refs/remotes/origin/main; then
                echo "::error::git fetch failed (attempt ${attempt})"
                return 1
              fi
              if ! git rebase origin/main; then
                git rebase --abort 2>/dev/null || true
                echo "::error::Rebase conflict against origin/main; stopping without push"
                return 1
              fi
              # 拒否理由は push --porcelain の出力で見分ける（"[rejected] (fetch first)" か "(non-fast-forward)" だけが再試行の対象）。
              if push_out=$(LC_ALL=C git push --porcelain origin HEAD:main 2>&1); then
                printf '%s\n' "$push_out"
                return 0
              fi
              printf '%s\n' "$push_out"
              if ! printf '%s\n' "$push_out" | grep -Eq '^!.*\[rejected\] \((fetch first|non-fast-forward)\)'; then
                echo "::error::git push failed for a reason other than non-fast-forward; not retrying"
                return 1
              fi
              if [ "$attempt" -ge 3 ]; then
                echo "::error::git push was rejected as non-fast-forward 3 times; giving up"
                return 1
              fi
              echo "::warning::non-fast-forward push (attempt ${attempt}); retrying in 5 seconds"
              attempt=$((attempt + 1))
              sleep 5
            done
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "更新なし"
          else
            git commit -m "Compact monitor public catalog"
            push_with_retry
          fi

      - id: artifact
        run: echo "name=github-pages-compact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Prepare lean Pages artifact
        run: |
          mkdir -p pages-public
          cp -a docs/. pages-public/
          rm -f pages-public/data.json pages-public/fetch_state.json pages-public/crawl_state.json \
                pages-public/views_history.json pages-public/notified_ids.json

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: pages-public

  pages:
    needs: compact
    permissions:
      pages: write
      id-token: write
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.compact.outputs.artifact }}
