name: Compact FC2 Monitor Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/catalog.json"
      - "docs/index.html"
      - "compact_public_catalog.py"
      - "web/missav-only.js"
      - ".github/workflows/compact-pages.yml"
  workflow_dispatch:

concurrency:
  group: fc2ppv-compact-pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  compact:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Compact monitor public catalog'
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compact public catalog and enforce MissAV destinations
        run: python compact_public_catalog.py

      - name: Ensure MissAV-only navigation guard is deployed
        run: |
          cp web/missav-only.js docs/missav-only.js
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path("docs/index.html")
          html = path.read_text(encoding="utf-8")
          tag = f'    <script src="missav-only.js?v={os.environ.get("GITHUB_SHA", "")[:12]}" defer></script>\n'
          if "missav-only.js" not in html:
              html = html.replace("</body>", tag + "</body>")
          path.write_text(html, encoding="utf-8")
          PY

      - name: Commit compact public assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "更新なし"
          else
            git commit -m "Compact monitor public catalog"
            git pull --rebase origin main
            git push
          fi

      - id: artifact
        run: echo "name=github-pages-compact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: docs

  pages:
    needs: compact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.compact.outputs.artifact }}
