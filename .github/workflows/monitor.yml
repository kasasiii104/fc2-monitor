# Aggressive automatic discovery: new works + historical backfill.
name: FC2PPV Monitor

on:
  schedule:
    # Fast discovery stays frequent. Heavy metadata/preview maintenance is split
    # out so it cannot permanently queue behind the 30-minute discovery lane.
    - cron: "7,37 * * * *"
    - cron: "52 */4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "fc2_monitor.py"
      - "aggressive_discovery.py"
      - "efficient_discovery.py"
      - "walker_official_fastlane.py"
      - "prioritize_title_backfill.py"
      - "advance_archive_cursor.py"
      - "missav_guard.py"
      - "walker_title_repair.py"
      - "repair_code_only_titles.py"
      - "embed_catalog_bootstrap.py"
      - "optimize_public_catalog.py"
      - "requirements.txt"
      - "tests/**"
      - "web/**"
      - ".github/workflows/monitor.yml"

concurrency:
  group: fc2ppv-monitor-main-v3
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      pages_artifact: ${{ steps.pages_artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify update and parser regressions
        run: python -m unittest discover -s tests -q

      - name: Verify MissAV-only navigation guard syntax
        run: node --check web/missav-only.js

      - name: Fast MissAV recent and archive discovery
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '7,37 * * * *') ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[discovery-now]'))
        env:
          PAGES: "60"
          BACKFILL_PAGES: "180"
          JAVDB_BACKFILL_PAGES: "24"
        run: python -u fc2_monitor.py --discovery-only

      - name: Add unseen Walker works to catalog
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'push' && (contains(github.event.head_commit.message, '[crawl-now]') || contains(github.event.head_commit.message, '[discovery-now]')))
        env:
          H_WALKER_DISCOVERY_LIMIT: "1800"
          H_WALKER_RECENT_PAGES: "16"
          H_WALKER_DISCOVERY_BUDGET_SEC: "150"
          H_WALKER_ARCHIVE_DEAD_RECHECK_SEC: "2592000"
          H_WALKER_OFFICIAL_FALLBACK_LIMIT: "40"
        run: python efficient_discovery.py

      - name: Verify more unseen Walker works against FC2 official
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'push' && (contains(github.event.head_commit.message, '[crawl-now]') || contains(github.event.head_commit.message, '[discovery-now]')))
        env:
          WALKER_OFFICIAL_FAST_LIMIT: "360"
          WALKER_OFFICIAL_FAST_WORKERS: "6"
          WALKER_OFFICIAL_FAST_BATCH: "30"
          WALKER_OFFICIAL_NOT_FOUND_RETRY_SEC: "2592000"
          WALKER_OFFICIAL_FAILED_RETRY_SEC: "43200"
        run: python walker_official_fastlane.py

      # Full metadata maintenance is deliberately less frequent than discovery.
      - name: Prioritize unresolved Japanese titles
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '52 */4 * * *') ||
          (github.event_name == 'push' && (contains(github.event.head_commit.message, '[crawl-now]') || contains(github.event.head_commit.message, '[titles-now]')))
        run: python prioritize_title_backfill.py

      - name: Run full monitor with MissAV 404 guard
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '52 */4 * * *') ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[crawl-now]'))
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INCLUDE_KEYWORDS: ${{ secrets.INCLUDE_KEYWORDS }}
          EXCLUDE_KEYWORDS: ${{ secrets.EXCLUDE_KEYWORDS }}
          PAGES: "48"
          BACKFILL_PAGES: "120"
          JAVDB_BACKFILL_PAGES: "24"
          H_WALKER_PAGES: "50"
          H_WALKER_REFRESH_SEC: "0"
          # Saved-link auditing is maintenance, not discovery. Keep it bounded;
          # a 1,500-item audit previously consumed most of the run while removing 0.
          MISSAV_404_AUDIT_LIMIT: "200"
        run: python missav_guard.py

      - name: Repair unresolved titles from Walker cache
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'push' && (contains(github.event.head_commit.message, '[crawl-now]') || contains(github.event.head_commit.message, '[discovery-now]') || contains(github.event.head_commit.message, '[titles-now]')))
        run: python walker_title_repair.py

      - name: Repair number-only titles before general backlog
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'push' && (contains(github.event.head_commit.message, '[crawl-now]') || contains(github.event.head_commit.message, '[discovery-now]') || contains(github.event.head_commit.message, '[titles-now]')))
        run: python repair_code_only_titles.py

      # Full 404 auditing remains available explicitly, but never blocks normal
      # new/archive discovery runs.
      - name: Audit MissAV 404 works without a full crawl
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[missav-audit]')
        env:
          MISSAV_404_AUDIT_LIMIT: "1500"
        run: python missav_guard.py --prune-only

      - name: Repair saved Japanese titles
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[titles-now]')
        run: |
          git fetch --depth=1 origin d7012e571cd74ffab62c70a6ec183685092ee95e
          git show d7012e571cd74ffab62c70a6ec183685092ee95e:docs/data.json > "$RUNNER_TEMP/title-recovery.json"
          TITLE_RECOVERY_FILE="$RUNNER_TEMP/title-recovery.json" python fc2_monitor.py --repair-titles

      - name: Audit discovery pagination without notifications
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[audit-discovery]')
        run: python -u fc2_monitor.py --audit-discovery

      - name: Advance past confirmed duplicate archive page
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'push' && (contains(github.event.head_commit.message, '[crawl-now]') || contains(github.event.head_commit.message, '[discovery-now]')))
        run: python advance_archive_cursor.py

      - name: Repair rankings and refresh views without notifications
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[updates-now]')
        run: python -u fc2_monitor.py --refresh-updates

      - name: Build site from saved data
        run: python fc2_monitor.py --build-site

      - name: Optimize public catalog for fast first paint
        run: |
          python optimize_public_catalog.py
          node --check docs/site.js
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/catalog.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data.get('progressive') is True
          assert len(data.get('items') or []) <= 300
          assert int(data.get('item_count') or 0) >= len(data.get('items') or [])
          print(f"manifest_bytes={p.stat().st_size} inline={len(data.get('items') or [])} chunks={len(data.get('chunks') or [])} total={data.get('item_count')}")
          PY

      - name: Embed instant first-paint catalog for mobile
        run: |
          python embed_catalog_bootstrap.py
          python - <<'PY'
          from pathlib import Path
          html = Path('docs/index.html').read_text(encoding='utf-8')
          assert 'id="catalogBootstrapData"' in html
          assert 'catalog-bootstrap:start' in html
          print(f"index_bytes={len(html.encode('utf-8'))} bootstrap=true")
          PY

      - name: Enforce MissAV-only outbound viewing
        run: |
          cp web/missav-only.js docs/missav-only.js
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("docs/index.html")
          html = path.read_text(encoding="utf-8")
          marker = "</body>"
          tag = f'    <script src="missav-only.js?v={os.environ.get("GITHUB_SHA", "")[:12]}" defer></script>\n'
          if "missav-only.js" not in html:
              html = html.replace(marker, tag + marker)
          path.write_text(html, encoding="utf-8")
          PY

      - name: Commit site data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          git add docs
          if git diff --cached --quiet; then
            echo "更新なし"
          else
            git commit -m "Update monitor site"
            git pull --rebase origin main
            git push
          fi

      - name: Select unique Pages artifact for this attempt
        id: pages_artifact
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Prepare lean Pages artifact
        run: |
          rm -rf pages-public
          mkdir -p pages-public
          cp -a docs/. pages-public/
          rm -f pages-public/data.json pages-public/fetch_state.json pages-public/crawl_state.json \
                pages-public/views_history.json pages-public/notified_ids.json
          du -sh pages-public

      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.pages_artifact.outputs.name }}
          path: pages-public

  pages:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.check.outputs.pages_artifact }}
