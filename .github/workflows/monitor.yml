name: FC2PPV Monitor

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "fc2_monitor.py"
      - "requirements.txt"
      - "web/**"
      - ".github/workflows/monitor.yml"

concurrency:
  group: fc2ppv-monitor-main
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        if: github.event_name != 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INCLUDE_KEYWORDS: ${{ secrets.INCLUDE_KEYWORDS }}
          EXCLUDE_KEYWORDS: ${{ secrets.EXCLUDE_KEYWORDS }}
        run: python fc2_monitor.py

      # A UI/code push can publish immediately using the saved catalog. Scheduled
      # runs still crawl every two hours and use the same renderer afterwards.
      - name: Build site from saved data
        run: python fc2_monitor.py --build-site

      - name: Commit site data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          git add docs
          if git diff --cached --quiet; then
            echo "更新なし"
          else
            git commit -m "Update monitor site"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  pages:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
