# Aggressive automatic discovery: new works + historical backfill.
name: FC2PPV Monitor

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "fc2_monitor.py"
      - "aggressive_discovery.py"
      - "missav_guard.py"
      - "requirements.txt"
      - "tests/**"
      - "web/**"
      - ".github/workflows/monitor.yml"

concurrency:
  group: fc2ppv-monitor-main-v2
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      pages_artifact: ${{ steps.pages_artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify update and parser regressions
        run: python -m unittest discover -s tests -q

      - name: Run monitor with MissAV 404 guard
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[crawl-now]')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INCLUDE_KEYWORDS: ${{ secrets.INCLUDE_KEYWORDS }}
          EXCLUDE_KEYWORDS: ${{ secrets.EXCLUDE_KEYWORDS }}
          PAGES: "36"
          BACKFILL_PAGES: "120"
          JAVDB_BACKFILL_PAGES: "24"
          H_WALKER_PAGES: "50"
          H_WALKER_REFRESH_SEC: "0"
          MISSAV_404_AUDIT_LIMIT: "1500"
        run: python missav_guard.py

      - name: Add unseen Walker works to catalog
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[crawl-now]') || contains(github.event.head_commit.message, '[discovery-now]')
        env:
          H_WALKER_DISCOVERY_LIMIT: "800"
          H_WALKER_RECENT_PAGES: "8"
        run: python aggressive_discovery.py

      - name: Prune MissAV 404 works on discovery-only runs
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[discovery-now]')
        env:
          MISSAV_404_AUDIT_LIMIT: "1500"
        run: python missav_guard.py --prune-only

      - name: Audit MissAV 404 works without a full crawl
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[missav-audit]')
        env:
          MISSAV_404_AUDIT_LIMIT: "1500"
        run: python missav_guard.py --prune-only

      - name: Repair saved Japanese titles
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[titles-now]')
        run: |
          # Snapshot immediately before the overbroad language filter. Restore
          # only missing Japanese titles; preserve newer metadata and works.
          git fetch --depth=1 origin d7012e571cd74ffab62c70a6ec183685092ee95e
          git show d7012e571cd74ffab62c70a6ec183685092ee95e:docs/data.json > "$RUNNER_TEMP/title-recovery.json"
          TITLE_RECOVERY_FILE="$RUNNER_TEMP/title-recovery.json" python fc2_monitor.py --repair-titles

      - name: Audit discovery pagination without notifications
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[audit-discovery]')
        run: python -u fc2_monitor.py --audit-discovery

      - name: Repair archive discovery without notifications
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[discovery-now]')
        env:
          PAGES: "36"
          BACKFILL_PAGES: "120"
          JAVDB_BACKFILL_PAGES: "24"
        run: python -u fc2_monitor.py --discovery-only

      - name: Repair rankings and refresh views without notifications
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[updates-now]')
        run: python -u fc2_monitor.py --refresh-updates

      # Code pushes publish saved data immediately. Scheduled runs crawl twice
      # per hour with wider recent/archive windows; existing source cooldowns
      # stop sources that begin rejecting requests instead of hammering them.
      - name: Build site from saved data
        run: python fc2_monitor.py --build-site

      - name: Commit site data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          git add docs
          if git diff --cached --quiet; then
            echo "更新なし"
          else
            git commit -m "Update monitor site"
            git pull --rebase origin main
            git push
          fi

      - name: Select unique Pages artifact for this attempt
        id: pages_artifact
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.pages_artifact.outputs.name }}
          path: docs

  pages:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.check.outputs.pages_artifact }}
