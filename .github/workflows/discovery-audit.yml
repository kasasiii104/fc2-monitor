name: Archive pagination audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/discovery-audit.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u fc2_monitor.py --audit-discovery
