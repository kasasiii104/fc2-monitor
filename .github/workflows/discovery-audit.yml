name: Archive pagination audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/discovery-audit.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u fc2_monitor.py --audit-discovery
